[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bcs"
version = "1.0.0"
description = "Band-count scaling in wavelength-conditioned foundation models (DOFA, Copernicus-FM) and its correction"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jeslin P James"}, {name = "Shailesh S"}]
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "scikit-learn", "torch", "h5py"]

[tool.setuptools]
packages = ["bcs"]
